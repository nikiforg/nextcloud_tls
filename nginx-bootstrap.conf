# Minimal nginx config used only during initial TLS certificate issuance.
# 'make deploy' starts a temporary nginx container with this config, obtains
# the certificate via the ACME HTTP-01 challenge, then tears the container down.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
