services:

  # --- MariaDB ---
  db:
    image: mariadb:latest
    container_name: nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    security_opt:
      - no-new-privileges:true
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ${DB_PATH}:/var/lib/mysql

  # --- Nextcloud App ---
  app:
    build: .
    image: nextcloud-custom:latest
    container_name: nextcloud-app
    restart: unless-stopped
    user: "${USER_ID}:${USER_ID}"
    security_opt:
      - no-new-privileges:true
    depends_on:
      - db
    environment:
      - PHP_MEMORY_LIMIT=1024M
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db
      - NEXTCLOUD_TRUSTED_DOMAINS=${DOMAIN}
    volumes:
      - ${HTML_PATH}:/var/www/html
      - ${NC_DATA_PATH}:/var/www/html/data

  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:stable-alpine
    container_name: nextcloud-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.generated:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app

  # --- Certbot for TLS certificate renewal ---
  certbot:
    image: certbot/certbot
    container_name: nextcloud-certbot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"
